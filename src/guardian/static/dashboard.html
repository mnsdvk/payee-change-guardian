<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayeeChange Guardian</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --ink:#0d1626; --mute:#586377; --line:#d9dfea; --line2:#e8ecf3;
  --trust:#0b7a62; --trust-bg:#d9f2ea; --bad:#b3261e; --bad-bg:#fde5e2; --warn:#8a5700; --warn-bg:#fff0d0; --live:#2447c9; --live-bg:#e4eaff;
  color-scheme:light; --node:#ffffff; --glow:rgba(36,71,201,.16); --shadow:0 1px 2px rgba(13,22,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#080d16; --panel:#0f1727; --panel2:#0b1220; --ink:#e8edf6; --mute:#8e9bb1; --line:#222d42; --line2:#1a2437;
  --trust:#3fd6b0; --trust-bg:#0e2b27; --bad:#ff8c80; --bad-bg:#341719; --warn:#f3b45a; --warn-bg:#2e2410; --live:#8eaaff; --live-bg:#16224b;
  --node:#0b1220; --glow:rgba(142,170,255,.30); --shadow:none; color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#080d16; --panel:#0f1727; --panel2:#0b1220; --ink:#e8edf6; --mute:#8e9bb1; --line:#222d42; --line2:#1a2437;
  --trust:#3fd6b0; --trust-bg:#0e2b27; --bad:#ff8c80; --bad-bg:#341719; --warn:#f3b45a; --warn-bg:#2e2410; --live:#8eaaff; --live-bg:#16224b;
  --node:#0b1220; --glow:rgba(142,170,255,.30); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:18px;height:18px;stroke:var(--bg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top b{font-size:16px;letter-spacing:-.01em}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.tools{margin-left:auto;display:flex;gap:8px;align-items:center}.btn.sm{padding:6px 14px}.btn.icon{width:36px;height:34px;padding:0;display:grid;place-items:center;line-height:0}.icon svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aichip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute);white-space:nowrap}.aichip.on{color:var(--trust);border-color:var(--trust)}.lnk{color:var(--live);text-decoration:none;font-weight:600}.lnk:hover{text-decoration:underline}
.top .d{color:var(--mute);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;margin-left:10px}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 20px 24px;max-width:1500px;margin:0 auto}
@media(min-width:1000px){.shell{grid-template-columns:300px minmax(0,1fr);align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
h2,h3{margin:0}h2{font-size:15px}
.rail{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.stat{padding:8px 4px;text-align:center;border-right:1px solid var(--line2)}.stat:last-child{border-right:0}
.stat b{display:block;font-size:20px;line-height:1.15;letter-spacing:-.02em}.stat b.z{color:var(--mute);font-weight:500}.stat small{color:var(--mute);font-size:12px}
.launch{display:flex;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;transition:border-color .15s,transform .15s}
.launch:hover{border-color:var(--ink);transform:translateY(-1px)}.launch:disabled{opacity:.6;cursor:progress;transform:none}
.launch.on{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.launch i{flex:none;width:6px;border-radius:3px;background:var(--bad)}.launch.legit i{background:var(--trust)}
.launch b{display:block}.launch span{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0}
.case{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px}
.case:hover{border-color:var(--mute)}.case[aria-current=true]{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.case .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.case small{color:var(--mute)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:650;white-space:nowrap}
.APPROVED{background:var(--trust-bg);color:var(--trust)}.BLOCKED{background:var(--bad-bg);color:var(--bad)}
.VERIFYING,.HELD,.RECEIVED{background:var(--live-bg);color:var(--live)}.ESCALATED,.UNKNOWN_VENDOR{background:var(--warn-bg);color:var(--warn)}
.stage{padding:20px 22px}
.hl{font-size:clamp(23px,2.5vw,31px);line-height:1.15;letter-spacing:-.025em;margin:0;font-weight:750}
.lede{color:var(--mute);margin:8px 0 14px;max-width:72ch}
.dec{padding:18px 22px;border-left:6px solid var(--live)}
.dec.BLOCKED{border-left-color:var(--bad)}.dec.APPROVED{border-left-color:var(--trust)}.dec.ESCALATED,.dec.UNKNOWN_VENDOR{border-left-color:var(--warn)}
.dtop{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}@media(min-width:760px){.dtop{grid-template-columns:minmax(0,1fr) auto}}
.crumb{color:var(--mute);font-size:13px}
.vt{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:750;margin:4px 0 4px}
.dec.BLOCKED .vt{color:var(--bad)}.dec.APPROVED .vt{color:var(--trust)}.dec.ESCALATED .vt,.dec.UNKNOWN_VENDOR .vt{color:var(--warn)}
.dec p{margin:0;color:var(--mute);max-width:70ch}
.risk{border:1px solid var(--line);border-radius:10px;padding:8px 16px;background:var(--panel2);min-width:160px;align-self:start}
.risk small{color:var(--mute)}.risk b{display:block;font-size:20px;letter-spacing:-.01em}
.risk.HIGH b{color:var(--bad)}.risk.MEDIUM b{color:var(--warn)}.risk.LOW b{color:var(--trust)}
.ba{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);margin-top:14px}@media(min-width:720px){.ba{grid-template-columns:repeat(3,1fr)}}
.acct{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2)}
.acct small{color:var(--mute);display:block;font-size:12.5px}.acct .n{font-size:19px;margin:1px 0 0;letter-spacing:.02em}.acct .bk{color:var(--mute);font-size:13px;min-height:1.4em}.acct .t{font-size:13px;font-weight:650;margin-top:2px}
.t.ok{color:var(--trust)}.t.no{color:var(--bad)}.t.wait{color:var(--live)}.t.hold{color:var(--warn)}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--mute)}.btn.yes{border-color:var(--trust);color:var(--trust)}.btn.no{border-color:var(--bad);color:var(--bad)}
.ai{display:flex;gap:12px;align-items:flex-start}.ai .tag{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--live);background:var(--live-bg);border-radius:6px;padding:2px 8px;margin-top:2px}.ai p{margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--mute)}
.say{display:flex;gap:8px;flex:1 1 280px}.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit}
.sec{margin-top:16px}.sec>.pad>h2{margin-bottom:4px}.sub{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.two{display:grid;gap:16px;align-items:stretch;grid-template-columns:minmax(0,1fr)}@media(min-width:1180px){.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.gwrap{overflow-x:auto}
svg.graph{width:100%;min-width:700px;height:auto;display:block}
.g-node{fill:var(--node);stroke:var(--line);stroke-width:1.3}
.g-bad .g-node{stroke:var(--bad);stroke-dasharray:5 4}.g-good .g-node{stroke:var(--trust)}
.g-t{fill:var(--ink);font-size:13px}.g-s{fill:var(--mute);font-size:11.5px}.g-h{fill:var(--mute);font-size:11.5px;font-weight:650;letter-spacing:.1em}
.g-strike{text-decoration:line-through}
.e-bad{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:6 5;fill:none}.e-good{stroke:var(--trust);stroke-width:2.2;fill:none}.e-mute{stroke:var(--mute);stroke-width:1.4;fill:none}
.g-x{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round}
.g-wall{stroke:var(--bad);stroke-width:1.4;stroke-dasharray:3 6;opacity:.7}
.g-pill{fill:var(--panel);stroke:var(--line)}
.g-lbl{font-size:11.5px;font-weight:650;fill:var(--ink)}.l-bad{fill:var(--bad)}.l-good{fill:var(--trust)}
.g-frame{fill:var(--panel);stroke:var(--live);stroke-width:2;filter:drop-shadow(0 0 12px var(--glow))}
.gs-BLOCKED .g-frame{stroke:var(--bad);--glow:rgba(179,38,30,.22)}.gs-APPROVED .g-frame{stroke:var(--trust);--glow:rgba(11,122,98,.22)}.gs-ESCALATED .g-frame,.gs-UNKNOWN_VENDOR .g-frame{stroke:var(--warn)}
.gs-idle .g-frame{stroke:var(--line)}
.g-gt{fill:var(--ink);font-size:11.5px;font-weight:750;letter-spacing:.14em}
.row .rb{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}.row .bd{fill:var(--line)}.row .bt{fill:var(--bg);font-size:12px;font-weight:700}
.row.active .rb{stroke:var(--live)}.row.active .bd{fill:var(--live)}
.row.done .bd{fill:var(--trust)}
.row.bad .rb{stroke:var(--bad);fill:var(--bad-bg)}.row.bad .bd{fill:var(--bad)}
.row.good .rb{stroke:var(--trust);fill:var(--trust-bg)}.row.good .bd{fill:var(--trust)}
.row.warn .rb{stroke:var(--warn);fill:var(--warn-bg)}.row.warn .bd{fill:var(--warn)}
.row.skip{opacity:.5}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:600;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}tr:last-child td{border-bottom:0}
td.w{font-weight:700;color:var(--warn);text-align:right;white-space:nowrap}td small{display:block;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0 8px 0 4px;max-height:460px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--mute) transparent}
@media(min-width:1180px){.tlcard{position:relative;min-height:420px}.tlcard>.pad{position:absolute;inset:0;display:flex;flex-direction:column}.tlcard .tl{flex:1;min-height:0;max-height:none}}
.clear{margin-top:6px;border-top:1px solid var(--line)}.clear h3{font-size:13px;color:var(--mute);font-weight:600;margin:12px 8px 6px}.clear div{display:flex;gap:10px;align-items:center;padding:5px 8px;color:var(--mute);font-size:13.5px}.clear i{flex:none;width:16px;height:16px;border-radius:50%;background:var(--trust-bg);color:var(--trust);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--live);border:2px solid var(--panel)}
.tl li.ok:before{background:var(--trust)}.tl li.bad:before{background:var(--bad)}.tl li.warn:before{background:var(--warn)}.tl li.dim:before{background:var(--mute)}
.tl b{display:block}.tl time{color:var(--mute);font-size:12.5px}.tl span{display:block;color:var(--mute);font-size:13.5px}
details summary{cursor:pointer;font-weight:650;list-style:none}details summary::-webkit-details-marker{display:none}
details summary:before{content:"+";display:inline-block;width:18px;color:var(--mute)}details[open] summary:before{content:"–"}
.raw{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <a href="#" id="home" class="brand" aria-label="PayeeChange Guardian, home"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span><b>PayeeChange Guardian</b><span class="d">Payment integrity</span></span></a>
  <div class="tools"><span class="aichip" id="aichip" title="Language model used for advisory notes"></span><button class="btn icon" id="reset" aria-label="Reset demo" title="Reset demo: clear all cases"></button><button class="btn sm icon" id="theme" aria-label="Switch theme"></button></div>
</div>
<div class="shell">
  <aside class="rail">
    <div class="stats" id="stats" aria-label="Case totals"></div>
    <div class="card pad">
      <h2>Run a scenario</h2>
      <button class="launch attack" data-s="fraud"><i></i><div><b>Fraud attempt</b><span>Spoofed sender, new bank account, and a new "confirm here" phone number</span></div></button>
      <button class="launch legit" data-s="legit"><i></i><div><b>Real supplier change</b><span>Known sender domain, same safeguards</span></div></button>
      <p class="hint" id="msg">Each run starts from the same supplier record.</p>
    </div>
    <div class="card pad"><h2>Cases</h2><div id="list"><p class="hint">No cases yet.</p></div></div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cut=(s,n)=>{s=String(s??"");return s.length>n?s.slice(0,n-1)+"…":s};
const mk=a=>a?"•••• "+String(a).replace(/\s/g,"").slice(-4):"none";
const SIG={BANK_ACCOUNT_CHANGE:"Payee account changed",UNREGISTERED_CONTACT_SUPPLIED:"New contact details supplied",PAYMENT_AND_VERIFICATION_CONTACT_CHANGE:"Account and verification contact changed together",SENDER_DOMAIN_NOT_SEEN:"Sender domain never seen for this supplier",REPLY_TO_MISMATCH:"Replies redirected elsewhere",EMAIL_AUTH_FAILURE:"Sender authentication failed",PRESSURE_LANGUAGE:"Urgency or secrecy wording",AMOUNT_ANOMALY:"Amount far above normal"};
const EV={EMAIL_RECEIVED:["Email received",""],RISK_ASSESSED:["Risk scored",""],PAYMENT_CHANGE_HELD:["Change held","warn"],POLICY:["Policy applied",""],APPROVER_EMAILED:["Approver notified","dim"],CHANNEL_UNAVAILABLE:["Channel skipped","dim"],VERIFICATION_SENT:["Verification sent to registered contact",""],REPLY_RECEIVED:["Reply received",""],SIMULATED_REPLY:["Reply simulated from dashboard","dim"],BLOCKED:["Blocked","bad"],APPROVED:["Approved","ok"],ESCALATED:["Escalated to a person","warn"],TIMEOUT:["No reply","warn"],SEND_FAILED:["Send failed","bad"],SECONDARY_CHECK_FAILED:["Extra check failed","bad"],NO_VENDOR_MATCH:["Unknown sender","warn"],NO_ACTION:["Nothing to verify","dim"],REPLY_REJECTED:["Reply rejected","bad"],AI_ANALYSIS:["AI note added","dim"],AI_UNAVAILABLE:["AI note skipped","dim"]};
const HERO={
 VERIFYING:["Held while we verify","The payment change is frozen. We asked the contact already on file and are waiting for their answer."],
 HELD:["Held while we verify","The payment change is frozen until the registered contact answers."],
 RECEIVED:["Request received","Scoring the request."],
 BLOCKED:["Payment change blocked","The registered contact said they did not make this request. The account on file was not modified."],
 APPROVED:["Payment change approved","The registered contact confirmed and the extra checks passed. The account on file was updated."],
 ESCALATED:["Needs a person","There was no clean confirmation. The change stays held and an approver was notified."],
 UNKNOWN_VENDOR:["No matching supplier","The sender is not in our supplier records, so nothing was changed."]};
const PENDING=["VERIFYING","HELD","RECEIVED"];
const tm=ts=>new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
let sel=null,cases=[],lastS=null;const busy={};
const lastSkip=c=>Math.max(0,...(c.timeline||[]).filter(e=>e.type==="AI_UNAVAILABLE").map(e=>e.t));
const aiPending=c=>!c.ai_analysis&&c.ai_started&&c.ai_started>lastSkip(c)&&(Date.now()/1000-c.ai_started<100);
async function api(p,o){const r=await fetch(p,o);return r.json()}

/* ---------- the gate diagram: every value comes from the case ---------- */
function graph(c){
  const sample=!c, q=c?.request||{}, tr=c?.trusted||{}, st=c?.state||"idle";
  const sender=sample?"supplier-domain.example":(q.sender_domain||"unknown");
  const claimed=sample?"New bank account":((q.new_bank?cut(q.new_bank,16)+" ":"")+mk(q.new_account));
  const phone=sample?"New phone number":((q.supplied_contacts||[])[0]||null);
  const onFile=sample?"Registered bank account":((tr.bank_name?cut(tr.bank_name,16)+" ":"")+mk(tr.account));
  const reg=sample?{channel:"email",to:"Registered contact"}:((tr.channels||[])[0]||null);
  const regT=reg?(reg.channel==="email"?"Registered email":reg.channel==="whatsapp"?"Registered WhatsApp":"Registered phone"):"Registered contact";
  const verS=sample?"idle":(PENDING.includes(st)?"active":(st==="UNKNOWN_VENDOR"?"skip":"done"));
  const decs={BLOCKED:["Blocked","bad","The contact denied the change"],APPROVED:["Approved","good","Contact confirmed, checks passed"],ESCALATED:["Needs a person","warn","No clean answer"],UNKNOWN_VENDOR:["No match","warn","Sender not in records"]};
  const d=decs[st];
  const pill=(x,y,t,cls)=>{const w=t.length*6.3+16;return `<g><rect class="g-pill" x="${x-w/2}" y="${y-10}" width="${w}" height="20" rx="10"/><text class="g-lbl ${cls||""}" x="${x}" y="${y+4}" text-anchor="middle">${esc(t)}</text></g>`};
  const node=(x,y,w,cls,t1,t2,strike)=>`<g class="${cls}"><rect class="g-node" x="${x}" y="${y}" width="${w}" height="56" rx="9"/><text class="g-s" x="${x+12}" y="${y+21}">${esc(t1)}</text><text class="g-t${strike?" g-strike":""}" x="${x+12}" y="${y+41}">${esc(cut(t2,28))}</text></g>`;
  const row=(y,n,cls,t1,t2,ok)=>{const cy=y+29;return `<g class="row ${cls}"><rect class="rb" x="356" y="${y}" width="248" height="58" rx="8"/><circle class="bd" cx="380" cy="${cy}" r="11"/><text class="bt" x="380" y="${cy+4}" text-anchor="middle">${ok||n}</text><text class="g-t" x="404" y="${cy-3}" style="font-weight:650">${esc(t1)}</text><text class="g-s" x="404" y="${cy+14}">${esc(cut(t2,32))}</text></g>`};
  const holdC=sample?"":"done", verC=verS==="idle"?"":verS, decC=d?d[1]:"";
  return `<svg class="graph" viewBox="0 0 960 330" role="img" aria-label="The payment change gate: email claims on the left are untrusted, records on the right are trusted">
   <text class="g-h" x="20" y="22">FROM THE EMAIL · UNTRUSTED</text>
   <text class="g-h" x="940" y="22" text-anchor="end">FROM OUR RECORDS · TRUSTED</text>
   <line class="g-wall" x1="292" y1="34" x2="292" y2="318"/>
   ${node(20,50,220,"g-bad","Sender domain",sender)}
   ${node(20,140,220,"g-bad","Pay to",claimed)}
   ${node(20,230,220,"g-bad","Confirm with",phone||"None supplied",!!phone)}
   <path class="e-bad" d="M240 78 C 280 78 300 100 340 112"/>
   <path class="e-bad" d="M240 168 C 280 168 300 160 340 156"/>
   ${phone?`<path class="e-bad" d="M240 258 L 282 258"/><g><line class="g-x" x1="283" y1="250" x2="299" y2="266"/><line class="g-x" x1="299" y1="250" x2="283" y2="266"/></g>${pill(266,288,"ignored","l-bad")}`:""}
   <g class="gs-${esc(st)}"><rect class="g-frame" x="340" y="40" width="280" height="262" rx="14"/>
    <text class="g-gt" x="356" y="66">PAYMENT CHANGE GATE</text>
    ${row(84,1,holdC,"Hold","Existing account stays in force","✓")}
    ${row(152,2,verC,"Verify",reg&&!sample?"Ask the registered "+reg.channel:"Ask the registered contact",verS==="done"?"✓":"")}
    ${row(220,3,decC,d?d[0]:"Decide",d?d[2]:(PENDING.includes(st)?"Awaiting the registered contact":"Their answer, plus extra checks"),d?(st==="BLOCKED"?"✕":"✓"):"")}
   </g>
   ${node(720,50,220,"g-good","Account on file",onFile)}
   ${node(720,230,220,"g-good",regT,reg?reg.to:"not available")}
   <path class="e-mute" d="M620 113 C 670 113 670 78 720 78"/>${pill(670,96,"compare")}
   <path class="e-good" d="M620 181 C 670 181 670 258 720 258"/>${pill(670,220,"verify via","l-good")}
  </svg>`}

/* ---------- views ---------- */
function stats(){
  const n=k=>cases.filter(c=>c.state===k).length;
  const held=cases.filter(c=>PENDING.includes(c.state)).length;
  $("#stats").innerHTML=[["Cases",cases.length],["Held",held],["Blocked",n("BLOCKED")],["Approved",n("APPROVED")]].map(x=>`<div class="stat"><b class="${x[1]?"":"z"}">${x[1]}</b><small>${x[0]}</small></div>`).join("")}
function list(){
  $("#list").innerHTML=cases.length?cases.map(c=>`<button class="case" data-id="${esc(c.case_id)}" aria-current="${c.case_id===sel}"><div class="r1"><b>${esc(c.vendor_name||"Unknown sender")}</b><span class="pill ${esc(c.state)}">${esc(c.state.replace("_"," ").toLowerCase())}</span></div><small>${c.risk?esc(c.risk.level.toLowerCase())+" risk, "+esc(c.risk.score)+" · ":""}${esc(tm(c.created))}</small></button>`).join(""):`<p class="hint">No cases yet.</p>`;
  document.querySelectorAll(".case").forEach(e=>e.onclick=()=>{location.hash="case/"+e.dataset.id})}
function empty(){
  $("#main").innerHTML=`<section class="card stage"><h1 class="hl">An email can request a change. It cannot authorize one.</h1>
  <p class="lede">Payment-detail changes stay on hold until verified through a contact already on record. Contact details in the email are never trusted.</p>
  <div class="gwrap">${graph(null)}</div>
  <p class="hint" style="margin:6px 0 0">Illustration of the idea. Run a scenario on the left and this diagram fills in from the real case.</p></section>`}
function aiCard(c){
  const tag=(t,on)=>`<span class="tag"${on?"":' style="color:var(--mute);background:var(--panel2)"'}>${t}</span>`;
  if(c.ai_analysis)return `<section class="card sec"><div class="pad ai">${tag("AI NOTE",1)}<div><p>${esc(c.ai_analysis.summary)}</p><div class="chips">${(c.ai_analysis.tactics||[]).filter(t=>t!=="none_detected").map(t=>`<span class="chip">${esc(t.replace(/_/g," "))}</span>`).join("")}<span class="chip" title="${esc(c.ai_analysis.model||"model")}">advisory only</span></div></div></div></section>`;
  if(busy[c.case_id]||aiPending(c))return `<section class="card sec"><div class="pad ai">${tag("AI NOTE",1)}<p style="color:var(--mute)">AI is reading the email…</p></div></section>`;
  const sk=(c.timeline||[]).find(e=>e.type==="AI_UNAVAILABLE");
  const msg=sk?sk.detail:(status.ai?"No AI note on this case. It was opened before the AI was switched on, or the request needed none.":"AI is switched off in this deployment. Rules and the registered contact still decide.");
  return `<section class="card sec"><div class="pad ai">${tag("AI NOTE",0)}<p style="color:var(--mute)">${esc(msg)}${sk?` <a class="lnk" href="#" data-retry="${esc(c.case_id)}">Try again</a>`:""}</p></div></section>`}
function view(c){
  const r=c.risk||{signals:[],level:"",score:0}, q=c.request||{}, tr=c.trusted||{}, st=c.state;
  const h=HERO[st]||[st,""];
  const afterAcct=st==="APPROVED"?mk(q.new_account):mk(tr.account);
  const afterBank=st==="APPROVED"?(q.new_bank||""):(tr.bank_name||"");
  const afterTag=st==="APPROVED"?["Updated","ok"]:st==="BLOCKED"?["Unchanged, protected","ok"]:["Unchanged, change on hold","hold"];
  const reqTag=({APPROVED:["Accepted","ok"],BLOCKED:["Rejected","no"],ESCALATED:["On hold for review","hold"],UNKNOWN_VENDOR:["Not applied","hold"]})[st]||["Pending verification","wait"];
  const act=st==="VERIFYING"?`<div class="act"><span class="hint" style="margin:0">Answer as the supplier, or use the email we sent:</span><button class="btn yes" data-a="yes">Yes, we made this change</button><button class="btn no" data-a="no">No, we did not</button></div><form class="act say" id="say"><input id="saytxt" maxlength="300" placeholder="Or reply in your own words, e.g. yes, but only if we pay by Friday" aria-label="Reply in your own words"><button class="btn">Send reply</button></form>`:"";
  const rows=(r.signals||[]).map(s=>`<tr><td><b>${esc(SIG[s.code]||s.code)}</b><small>${esc(s.detail)}</small></td><td class="w">+${esc(s.weight)}</td></tr>`).join("");
  const steps=(c.timeline||[]).map(e=>{const m=EV[e.type]||[e.type,""];return `<li class="${m[1]}"><time>${esc(tm(e.t))}${e.channel?" · "+esc(e.channel):""}</time><b>${esc(m[0])}</b><span>${esc(e.detail)}</span></li>`}).join("");
  const CLEAR={SENDER_DOMAIN_NOT_SEEN:"Sender domain history",EMAIL_AUTH_FAILURE:"Email authentication (SPF, DKIM)",UNREGISTERED_CONTACT_SUPPLIED:"New contact details in the email",REPLY_TO_MISMATCH:"Reply-to address",PRESSURE_LANGUAGE:"Urgency or secrecy wording",AMOUNT_ANOMALY:"Amount against the normal range"};
  const hit=new Set((r.signals||[]).map(x=>x.code));
  const clear=r.level?Object.keys(CLEAR).filter(k=>!hit.has(k)).map(k=>`<div><i>✓</i>${esc(CLEAR[k])}</div>`).join(""):"";
  $("#main").innerHTML=`
  <section class="card dec ${esc(st)}"><div class="dtop"><div>
      <div class="crumb"><a class="lnk" href="#">Home</a> › ${esc(c.vendor_name||"Unknown sender")} · bank detail change · <span class="mono">${esc(c.case_id)}</span> · opened ${esc(tm(c.created))}</div>
      <div class="vt">${esc(h[0])}</div><p>${esc(c.outcome||h[1])}</p></div>
    ${r.level?`<div class="risk ${esc(r.level)}"><small>Risk summary</small><b>${esc(r.level.charAt(0)+r.level.slice(1).toLowerCase())} risk</b><small>Score ${esc(r.score)} of 100</small></div>`:""}</div>
    ${c.trusted?`<div class="ba">
      <div class="acct"><small>Account on file, before</small><div class="n mono">${esc(mk(tr.account))}</div><div class="bk">${esc(tr.bank_name||"")}</div><div class="t">Registered earlier</div></div>
      <div class="acct"><small>Account on file, after</small><div class="n mono">${esc(afterAcct)}</div><div class="bk">${esc(afterBank)}</div><div class="t ${afterTag[1]}">${esc(afterTag[0])}</div></div>
      <div class="acct"><small>Requested in the email</small><div class="n mono">${esc(mk(q.new_account))}</div><div class="bk">${esc(q.new_bank||"")}</div><div class="t ${reqTag[1]}">${esc(reqTag[0])}</div></div></div>`:""}${act}</section>
  ${aiCard(c)}
  <section class="card sec"><div class="pad"><h2>How this decision was made</h2><p class="sub">The email's claims are evidence only. Verification goes to the contact already on record.</p><div class="gwrap">${graph(c)}</div></div></section>
  <div class="two sec">
    <section class="card"><div class="pad"><h2>Evidence</h2><p class="sub">${rows?"Signals found in the email, with the points each added to the risk score.":"No risk signals."}</p>${rows?`<table><thead><tr><th>Signal</th><th style="text-align:right">Points</th></tr></thead><tbody>${rows}</tbody></table>`:""}${clear?`<div class="clear"><h3>Checked, nothing found</h3>${clear}</div>`:""}</div></section>
    <section class="card tlcard"><div class="pad"><h2>Decision timeline</h2><p class="sub">Every step is recorded.</p><ul class="tl">${steps}</ul></div></section>
  </div>
  <section class="card sec"><div class="pad"><details><summary>The email we received (untrusted)</summary><div class="raw">From: ${esc(q.sender)}\nSubject: ${esc(q.subject||"")}\n\n${esc(q.body)}</div></details></div></section>`;
  const rt=document.querySelector("[data-retry]");if(rt)rt.onclick=e=>{e.preventDefault();analyze(c,true)};
  const say=$("#say");if(say)say.onsubmit=async e=>{e.preventDefault();const t=$("#saytxt").value.trim();if(!t)return;say.querySelector("button").disabled=true;await api("/api/simulate-reply",{method:"POST",body:JSON.stringify({case_id:c.case_id,text:t})});setTimeout(load,900)};
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{b.disabled=true;await api("/api/simulate-reply",{method:"POST",body:JSON.stringify({case_id:c.case_id,answer:b.dataset.a})});setTimeout(load,900)})}
async function analyze(c,force){
  if(!status.ai||c.ai_analysis||busy[c.case_id]||c.risk===undefined||aiPending(c))return;
  if(!force&&lastSkip(c)>0)return;
  if(!force&&c.ai_started)return;
  busy[c.case_id]=1;draw();
  try{await api("/api/cases/"+encodeURIComponent(c.case_id)+"/analyze",{method:"POST",body:JSON.stringify({force:!!force})})}catch(e){}
  delete busy[c.case_id];load.sig="";await load()}
function draw(){stats();list();const c=cases.find(x=>x.case_id===sel);c?view(c):empty();if(c)analyze(c)}
async function load(){try{cases=await api("/api/cases")}catch(e){return}
  const sig=JSON.stringify([cases.map(c=>[c.case_id,c.state,(c.timeline||[]).length]),sel]);
  if(sig!==load.sig){load.sig=sig;draw()}else{stats()}}
document.querySelectorAll(".launch").forEach(b=>b.onclick=async()=>{
  b.disabled=true;$("#msg").textContent="Running…";
  try{const r=await api("/api/scenarios",{method:"POST",body:JSON.stringify({scenario:b.dataset.s})});lastS=b.dataset.s;location.hash="case/"+r.case_id;$("#msg").textContent="Case opened. Verification goes to the registered contact."}
  catch(e){$("#msg").textContent="Could not start the scenario. Try again."}
  document.querySelectorAll(".launch").forEach(x=>x.classList.toggle("on",x.dataset.s===lastS));
  b.disabled=false;load.sig="";setTimeout(load,700)});
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
let stored=null;try{stored=localStorage.getItem("theme")}catch(e){}
const mq=matchMedia("(prefers-color-scheme: dark)");
const eff=()=>stored||(mq.matches?"dark":"light");
function applyTheme(){const t=eff();document.documentElement.setAttribute("data-theme",t);const b=$("#theme");b.innerHTML=t==="dark"?SUN:MOON;const l=t==="dark"?"Switch to light theme":"Switch to dark theme";b.setAttribute("aria-label",l);b.title=l}
$("#theme").onclick=()=>{stored=eff()==="dark"?"light":"dark";try{localStorage.setItem("theme",stored)}catch(e){}applyTheme()};
if(mq.addEventListener)mq.addEventListener("change",()=>{if(!stored)applyTheme()});
applyTheme();
const RST='<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
const rb=$("#reset");rb.innerHTML=RST;
rb.onclick=async()=>{
  try{await api("/api/reset",{method:"POST"})}catch(e){}
  lastS=null;document.querySelectorAll(".launch").forEach(x=>x.classList.remove("on"));
  cases=[];load.sig="";$("#msg").textContent="Demo reset. Run a scenario to start.";
  if(location.hash)location.hash="";else{sel=null;draw()}load()};
function route(){const m=location.hash.match(/^#case\/(.+)$/);sel=m?decodeURIComponent(m[1]):null;draw();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
let status={};
api("/api/status").then(x=>{status=x||{};const c=$("#aichip");c.textContent=status.ai?"AI on":"AI off";c.title=status.ai?("Advisory notes use "+status.ai+(status.model?" ("+status.model+")":"")+". The model never decides."):"Rules and the registered contact decide.";c.classList.toggle("on",!!status.ai);const m=cases.find(z=>z.case_id===sel);if(m)draw()}).catch(()=>{$("#aichip").textContent="AI"});
route();load();setInterval(load,3000);
</script>
</body>
</html>
